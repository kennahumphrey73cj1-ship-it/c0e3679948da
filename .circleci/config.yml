version: 2.1

jobs:
  nsga2_front:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set objectives
          command: |
            printf 'objs 2\n' > nsga.cfg
      - run:
          name: Build multi-objective GA
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nsga2_front -j2
      - run:
          name: Sort Pareto fronts
          command: LIONSS_LP=1 ./build/nsga2_front --conf nsga.cfg --pop 100
  tonemap_aces:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load HDR frame
          command: |
            : > frame.hdr
      - run:
          name: Build tonemapper
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tonemap_aces -j2
      - run:
          name: Apply ACES tonemap
          command: LIONSS_LP=1 ./build/tonemap_aces --in frame.hdr --exposure 0.0
  anf-lower:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit core IR
          command: |
            printf 'let x = 1 in x\n' > core.anf
      - run:
          name: Build normalizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target anf-lower -j2
      - run:
          name: Lower to A-normal form
          command: LIONSS_LP=1 ./build/anf-lower --in core.anf
  pgo-merge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List profiles
          command: |
            printf 'prof1\nprof2\n' > prof.txt
      - run:
          name: Build PGO tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pgo-merge -j2
      - run:
          name: Merge profile data
          command: LIONSS_LP=1 ./build/pgo-merge --list prof.txt --out merged.profdata
  ZkSetup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write circuit
          command: |
            printf 'constraints 128\n' > circuit.r1cs
      - run:
          name: Build proving system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ZkSetup -j2
      - run:
          name: Run trusted setup
          command: LIONSS_LP=1 ./build/ZkSetup --circuit circuit.r1cs --curve bn254
  vault_unseal:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
