          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load humidity field
          command: |
            printf 'rh 95\n' > fog.cfg
      - run:
          name: Build volumetric sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target fogbank -j2
      - run:
          name: Advect fogbank
          command: LIONSS_LP=1 ./build/fogbank --config fog.cfg --wind 2

